  <style>
    /* Upgrade Modal Styles */
    #upgrade-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
    }
    #upgrade-modal {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #1E293B;
      border-radius: 16px;
      padding: 24px;
      border: 0.5px solid #F97316;
      max-width: 380px;
      width: 90%;
      z-index: 1000;
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #upgrade-modal .crown-icon {
      font-size: 48px;
      color: #F97316;
      margin-bottom: 16px;
    }
    #upgrade-modal h3 {
      font-size: 14px;

      color: #F1F5F9;
      margin: 0 0 8px 0;
    }
    #upgrade-modal p {
      font-size: 13px;
      color: #94A3B8;
      margin: 0 0 16px 0;
      line-height: 1.5;
    }
    #upgrade-modal .countdown {
      font-size: 11px;
      color: #64748B;
      margin-bottom: 20px;
    }
    #upgrade-modal .btn-upgrade {
      display: block;
      background: #22C55E;
      color: #052e16;
      width: 100%;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      border: none;
      cursor: pointer;
      margin-bottom: 8px;
    }
    #upgrade-modal .btn-close {
      display: block;
      color: #64748B;
      font-size: 12px;
      background: none;
      border: none;
      width: 100%;
      cursor: pointer;
      padding: 8px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Upgrade Modal -->
  <div id="upgrade-modal-overlay"></div>
  <div id="upgrade-modal">
    <div class="crown-icon">👑</div>
    <h3>You've used all 10 free questions today 🏆</h3>
    <p>Upgrade to Standard and get unlimited AI help — for less than 2 moto-taxi rides per month.</p>
    <div class="countdown" id="upgrade-countdown">Resets in: --:--:--</div>

    <!-- Phone bonus section — only shown if user hasn't claimed it yet -->
    <div id="phone-bonus-section" style="display:none; margin: 14px 0; padding: 12px 14px; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); border-radius: 12px; text-align:left;">
      <div style="font-size:13px; font-weight:700; color:#22C55E; margin-bottom:4px;">🎁 Get 25 free tokens!</div>
      <div style="font-size:12px; color:#94A3B8; margin-bottom:10px; line-height:1.5;">Add your WhatsApp number in your profile and instantly receive 25 free tokens — one time only.</div>
      <button onclick="goToProfileForPhone()" style="width:100%; background:#22C55E; color:#052e16; border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;">
        Add my number → get 25 free tokens
      </button>
    </div>

    <button class="btn-upgrade" onclick="window.closeUpgradeModal(); if(window.passmarkOpenTokenShop) window.passmarkOpenTokenShop();">Upgrade — 3 500 FCFA →</button>
    <button class="btn-close" onclick="closeUpgradeModal()">Continue tomorrow</button>
  </div>

  <script>
    // Global function to show modal (can be called from React)
    window.showUpgradeModal = function() {
      document.getElementById('upgrade-modal-overlay').style.display = 'block';
      document.getElementById('upgrade-modal').style.display = 'block';
      startCountdown();
      // Show phone bonus section only if user hasn't claimed it yet
      try {
        const stored = localStorage.getItem('passmark_user');
        if (stored) {
          const user = JSON.parse(stored);
          const hasPhone = user.phone && user.phone.length > 0;
          if (!hasPhone) {
            document.getElementById('phone-bonus-section').style.display = 'block';
          }
        }
      } catch(e) {}
    };

    window.goToProfileForPhone = function() {
      window.closeUpgradeModal();
      if (window.passmarkNavigate) {
        window.passmarkNavigate('profile');
      }
    };

    window.closeUpgradeModal = function() {
      document.getElementById('upgrade-modal-overlay').style.display = 'none';
      document.getElementById('upgrade-modal').style.display = 'none';
    };

    function startCountdown() {
      const el = document.getElementById('upgrade-countdown');
      setInterval(() => {
        const now = new Date();
        const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        const diff = tomorrow - now;
        
        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);
        
        el.innerText = `Resets in: ${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }, 1000);
    }

    // Check on load if user hit limit
    window.addEventListener('load', () => {
      const stored = localStorage.getItem('passmark_user');
      if (stored) {
        try {
          const user = JSON.parse(stored);
          // If user is free and has solved >= 10 questions today (mock logic based on total stats for now)
          if (user.stats && user.stats.questionsSolved >= 10 && user.plan !== 'Standard' && user.plan !== 'Premium') {
            // Optional: Only show once per session to avoid annoying the user
            if (!sessionStorage.getItem('upgrade_modal_shown')) {
              setTimeout(() => {
                window.showUpgradeModal();
                sessionStorage.setItem('upgrade_modal_shown', 'true');
              }, 2000);
            }
          }
        } catch (e) {}
      }
    });
  </script>

  <!-- Polyfill Promise.withResolvers — missing in iOS Safari < 17.4, required by PDF.js -->
  <script>
    if (typeof Promise.withResolvers === 'undefined') {
      Promise.withResolvers = function () {
        var resolve, reject;
        var promise = new Promise(function (res, rej) { resolve = res; reject = rej; });
        return { promise: promise, resolve: resolve, reject: reject };
      };
    }
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
