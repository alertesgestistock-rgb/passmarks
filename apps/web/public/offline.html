<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PassMark — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0F172A;
      color: #F1F5F9;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 16px;
    }
    .icon { font-size: 64px; }
    h1 { font-size: 22px; font-weight: 600; }
    p { font-size: 14px; color: #94A3B8; max-width: 300px; line-height: 1.6; }
    button {
      margin-top: 8px;
      background: #F97316;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="icon">📶</div>
  <h1>You're offline</h1>
  <p>Check your connection and try again. Your cached sessions are still accessible.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
